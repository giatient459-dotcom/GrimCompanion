name: Build GrimCompanion

on:
  push:
    branches: [ "1.0" ]
  pull_request:
    branches: [ "1.0" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Update actions/checkout lên v4 (giữ nguyên, chấp nhận warning)
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. UPDATE: actions/setup-java từ v4 lên v5
      - name: Set up JDK 21
        uses: actions/setup-java@v5  # ĐỔI TỪ v4 THÀNH v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      # 3. UPDATE: gradle/actions/setup-gradle từ v4 lên v5
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5  # ĐỔI TỪ v4 THÀNH v5

      # 4. Build plugin
      - name: Build with Gradle
        run: gradle build --no-daemon

      # 5. Upload artifact
      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: GrimCompanion-jar
          path: build/libs/*.jar
          if-no-files-found: error

      # 6. Run tests
      - name: Run tests
        run: gradle test --no-daemon
        continue-on-error: true
