# =========================================================
#  GrimCompanion Configuration
#  Plugin bo sung cho GrimAC - phat hien cac dang gian lan
#  ma GrimAC chua bao phu hoac can tuy chinh rieng.
# =========================================================

prefix: "§8[§cGrimCompanion§8] §r"
debug: false

# Luu log vi pham vao file (plugins/GrimCompanion/logs/)
log-to-file: true

# =========================================================
#  Tich hop GrimAC (hoan toan TUY CHON - GrimCompanion co PredictionEngine rieng,
#  khong can GrimAC de hoat dong day du. Muc nay chi dung de DOI CHIEU du lieu.)
# =========================================================
# =========================================================
#  PredictionEngine - engine mo phong vat ly di chuyen RIENG cua GrimCompanion
#  (dung boi FlightCheck va SpeedCheck, khong phu thuoc GrimAC)
# =========================================================
engine:
  vertical-tolerance: 0.035        # do lech van toc Y (block/tick) cho phep truoc khi tru trust buffer
  horizontal-tolerance-multiplier: 1.25   # % vuot qua toc do ngang cho phep truoc khi tru trust buffer
  max-trust-buffer: 6.0            # so lan sai lech lien tiep duoc "tha" truoc khi thuc su flag (giam false positive)

# =========================================================
#  Tuong thich voi plugin khac
# =========================================================
compatibility:
  # Neu true: khi phat hien 1 anti-cheat KHAC (Vulcan, NoCheatPlus, AAC...) dang chay,
  # GrimCompanion se TU DONG TAT Flight/Speed/NoSlowdown de tranh 2 plugin cung flag/kick
  # trung lap cho cung 1 hanh vi. Xem AntiCheatDetector.java de biet danh sach da nhan dien.
  # Mac dinh false vi ban co the muon giu ca 2 chay song song de doi chieu ket qua.
  auto-disable-movement-on-conflict: false

integration:
  # Dua vi pham (flag/punishment) tu GrimAC vao chung he thong canh bao/thong ke
  # cua GrimCompanion (/gc stats, /gc check), hien thi voi tien to "Grim:" de phan biet
  # voi vi pham tu PredictionEngine rieng cua GrimCompanion. Xem GrimIntegration.java.
  relay-grimac-violations: true

# So lich su goi packet toi da luu cho moi nguoi choi (tranh memory leak)
data-history-size: 200

checks:
  crystalaura:
    enabled: true
    min-delay: 100          # ms toi thieu giua 2 lan dat/pha crystal
    same-tick-window-ms: 55 # ~1 tick server; tuong tac >=2 crystal khac nhau trong khoang nay = vi pham
    max-violations: 10
  anchoraura:
    enabled: true
    min-delay: 100
    same-tick-window-ms: 55
    max-violations: 10
  autoclicker:
    enabled: true
    max-cps: 20
    min-stddev: 20           # do lech chuan (ms) toi thieu giua cac cu click, thap qua = click may
    sample-size: 20          # so click can thu thap truoc khi tinh stddev
    max-violations: 10
  killaura:
    enabled: true
    max-angle: 120           # do lech goc nhin toi da giua 2 tick (snap)
    max-violations: 10
  reach:
    enabled: true
    max-reach: 3.2           # block
    max-violations: 10
  flight:
    enabled: true
    max-air-ticks: 20        # so tick o tren khong ma khong roi ma khong hop le
    max-violations: 10
  speed:
    enabled: true
    max-speed-multiplier: 1.35   # % vuot qua toc do base cho phep
    max-violations: 10
  noslowdown:
    enabled: true
    max-violations: 10
  itemmacro:
    enabled: true
    max-cps: 10
    sample-size: 8            # so lan dung item can thu thap truoc khi tinh stddev
    min-stddev: 15            # do lech chuan (ms) toi thieu, thap qua = nghi ngo bind macro
    max-violations: 10
  autofirework:
    enabled: true
    max-cps: 6
    sample-size: 6
    min-stddev: 15
    max-violations: 10
  elytratarget:
    enabled: true
    max-targets: 3            # so lan doi huong ve entity gan nhat trong khoang thoi gian ngan
    window-ms: 3000
    max-violations: 10
  autocart:
    enabled: true
    max-cps: 6                # so lan moi TNT toi da moi giay
    sample-size: 8
    min-stddev: 25            # do lech chuan (ms) toi thieu, thap qua = nghi ngo macro moi TNT
    max-violations: 10
  crystaloptimizer:
    enabled: true
    # Danh sach brand bi coi la Crystal Optimizer/tuong tu - doi chieu voi client brand
    # da ghi nhan tu ClientBrandCheck (xem CrystalOptimizerCheck.java).
    blocked-brands:
      - "marlow's crystal optimizer"
      - "crystal optimizer"
      - "crystalclient"
    max-violations: 10
  clientbrand:
    enabled: true
    blocked-brands:
      - "marlow's crystal optimizer"
      - "crystalclient"
      - "wurst"
      - "impact"
      - "aristois"
    require-brand-within-ticks: 100
    max-violations: 10
  ping:
    enabled: true
    max-ping: 300
    keepalive-spoof-tolerance-ms: 50
    spoof-sample-size: 10       # so keep-alive lien tuc can xem xet de ket luan spoof
    spoof-max-stddev: 2.0       # do lech chuan (ms) toi da - qua deu = nghi ngo spoof
    max-violations: 10
  scaffold:
    enabled: true
    max-cps: 5                # so block dat toi da moi giay khi scaffold
    max-violations: 10

punishments:
  warn-level: 3
  kick-level: 10
  ban-level: 20
  # Lenh chay khi ban (dung plugin ban quan ly, vd: EssentialsX)
  ban-command: "ban {player} Bi phat hien gian lan boi GrimCompanion (VL vuot nguong)"

messages:
  kick: "§c❌ Ban da bi kick do vi pham anti-cheat!"
  ban: "§c❌ Ban da bi ban do vi pham anti-cheat!"
  warn: "§e⚠ §7Canh bao: §f{player} §7flag §c{check} §7(VL: §f{vl}§7)"
  reload-success: "§a✔ Da reload config GrimCompanion thanh cong!"
  no-permission: "§c❌ Ban khong co quyen thuc hien lenh nay!"
  player-not-found: "§c❌ Khong tim thay nguoi choi!"
  alerts-on: "§a✔ Da bat che do nhan canh bao!"
  alerts-off: "§c✖ Da tat che do nhan canh bao!"
  reset-success: "§a✔ Da reset VL cua {player}!"
