plugins {
    id 'java'
}

group = 'com.grimcompanion'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

// Force download dependencies từ Maven Central trước
repositories {
    mavenCentral()  // Ưu tiên Maven Central
    maven {
        name = "papermc"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven {
        name = "codemc"
        url = "https://repo.codemc.io/repository/maven-public/"
    }
    maven {
        name = "jitpack"
        url = "https://jitpack.io"
    }
    maven {
        name = "grimac"
        url = "https://repo.grim.ac/releases"
    }
    maven {
        name = "grimacSnapshots"
        url = "https://repo.grim.ac/snapshots"
    }
}

processResources {
    filteringCharset = 'UTF-8'
    def props = [version: version]
    inputs.properties props
    filesMatching('plugin.yml') {
        expand props
    }
}

tasks.build {
    dependsOn tasks.jar
}

jar {
    archiveBaseName.set('GrimCompanion')
    archiveVersion.set(version.toString())
}
