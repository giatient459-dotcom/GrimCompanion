plugins {
    id 'java'
}

group = 'com.grimcompanion'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
    maven {
        name = "papermc"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven {
        name = "codemc"
        url = "https://repo.codemc.io/repository/maven-public/"
    }
    maven {
        name = "jitpack"
        url = "https://jitpack.io"
    }
    maven {
        name = "grimac"
        url = "https://repo.grim.ac/releases"
    }
    maven {
        name = "grimacSnapshots"
        url = "https://repo.grim.ac/snapshots"
    }
}

dependencies {
    compileOnly "io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT"
    compileOnly "com.github.retrooper:packetevents-spigot:2.13.0"
    
    // GrimAC API - dùng SNAPSHOT
    compileOnly "ac.grim.grimac:api:2.3.62-SNAPSHOT"
}

def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    if (targetJavaVersion >= 10) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    filteringCharset = 'UTF-8'
    def props = [version: version]
    inputs.properties props
    filesMatching('plugin.yml') {
        expand props
    }
}

tasks.build {
    dependsOn tasks.jar
}

jar {
    archiveBaseName.set('GrimCompanion')
    archiveVersion.set(version.toString())
}
